name: Docs site

on:
    push:
        branches: [main]
        paths:
            - docs/guide/**
            - apps/docs-site-fumadocs/**
            - pnpm-lock.yaml
            - pnpm-workspace.yaml
            - package.json
            - .github/workflows/pages.yml
    workflow_dispatch:

permissions:
    contents: read

# Publish one build at a time, and never cancel one halfway through an upload.
concurrency:
    group: docs-site-deploy
    cancel-in-progress: false

jobs:
    deploy:
        name: Deploy to Cloudflare Pages
        runs-on: ubuntu-latest
        timeout-minutes: 10
        env:
            NEXT_TELEMETRY_DISABLED: "1"
            # pages.dev serves from the root, so the site has no base path.
            SITE_BASE: ""

        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up pnpm and Node.js
              uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
              with:
                  runtime: node@24
                  cache: true
                  install: false

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build the site
              run: pnpm --filter @hyperion-js/docs-site-fumadocs site:build

            - name: Check the built site
              run: pnpm --filter @hyperion-js/docs-site-fumadocs site:check

            # Only this step gets the token; install and build run third-party code.
            - name: Publish
              working-directory: apps/docs-site-fumadocs
              env:
                  CLOUDFLARE_ACCOUNT_ID: a3502c4f73afb21718326402c5423fa5
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
              run: pnpm dlx wrangler@4.157.0 pages deploy out --project-name hyperion-docs --branch main --commit-dirty=true
