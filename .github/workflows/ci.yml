name: CI

on:
    pull_request:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    checks:
        name: Checks
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up pnpm and Node.js
              uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
              with:
                  runtime: node@24
                  cache: true
                  install: false

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Type check and test all packages
              run: pnpm exec turbo run typecheck test --cache=local:rw

            - name: Verify cache correctness
              run: pnpm verify:cache

            - name: Verify packed package consumers
              run: pnpm verify:package

            - name: Lint and format check
              run: pnpm check
