name: CI

on:
    pull_request:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    changes:
        name: Changes
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
            code: ${{ steps.classify.outputs.code }}
            site: ${{ steps.classify.outputs.site }}
            cache: ${{ steps.classify.outputs.cache }}

        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  # Full history, so the comparison needs no later fetch (and no credentials).
                  fetch-depth: 0
                  persist-credentials: false

            - name: Decide which jobs the change needs
              id: classify
              env:
                  BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
              run: node scripts/ci-changes.mjs "$BASE" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

    lint:
        name: Lint and docs
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up pnpm and Node.js
              uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
              with:
                  runtime: node@24
                  cache: true
                  install: false

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Lint, format, and documentation check
              run: pnpm check

    code:
        name: Code
        needs: changes
        if: needs.changes.outputs.code == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up pnpm and Node.js
              uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
              with:
                  runtime: node@24
                  cache: true
                  install: false

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Type check and test all packages
              run: pnpm exec turbo run typecheck test --cache=local:rw

            - name: Test CI helper scripts
              run: node --test scripts/*.test.mjs

            - name: Verify release tooling
              run: pnpm verify:release

            - name: Verify cache correctness
              # Only when Turbo, package, or TypeScript config changes; see docs/ci.md.
              if: needs.changes.outputs.cache == 'true'
              run: pnpm verify:cache

            - name: Verify packed package consumers
              run: pnpm verify:package

    site:
        name: Docs site
        needs: changes
        if: needs.changes.outputs.site == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        env:
            NEXT_TELEMETRY_DISABLED: "1"
            # Build the way the published site is built: at the root of pages.dev.
            SITE_BASE: ""

        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up pnpm and Node.js
              uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
              with:
                  runtime: node@24
                  cache: true
                  install: false

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build the site
              run: pnpm --filter @hyperion/docs-site-fumadocs site:build

            - name: Check the built site
              run: pnpm --filter @hyperion/docs-site-fumadocs site:check

    # One stable result for the whole workflow, so a future branch protection rule
    # can require `Checks` regardless of which jobs a change needed. A skipped job
    # passes; a failed or cancelled one fails.
    checks:
        name: Checks
        if: always()
        needs: [changes, lint, code, site]
        runs-on: ubuntu-latest
        timeout-minutes: 5

        steps:
            - name: Fail if any job failed or was cancelled
              if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
              run: exit 1

            - name: Every required job passed or was skipped
              run: echo "changes=${{ needs.changes.result }} lint=${{ needs.lint.result }} code=${{ needs.code.result }} site=${{ needs.site.result }}"
